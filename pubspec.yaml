name: ai_visual_assistant
description: "AI Visual Assistant MVP for visually impaired users."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  web_socket_channel: ^3.0.1
  http: ^1.2.1
  permission_handler: ^11.3.1
  camera: ^0.10.5+9
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5
  uuid: ^4.4.0
  image: ^4.2.0
  shared_preferences: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true